<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F2F AI Proje Ajanı — Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/plugin/css/widget.css" />
    <link rel="stylesheet" href="/assets/demo.css" />
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-top">
        <div class="brand">
          <span class="brand-mark">F2F</span>
          <span class="brand-name">Bilişim</span>
        </div>
        <p class="mode-pill" id="modePill">Yükleniyor…</p>
      </header>

      <main class="hero">
        <p class="eyebrow">WordPress eklenti önizlemesi</p>
        <h1>AI Proje Ajanı</h1>
        <p class="lede">
          Keşif → iletişim formu → OpenAI sohbeti. Sağ alttaki balona tıklayın;
          hizmet seçince veya yazınca önce lead formu açılır.
        </p>
        <div class="cta-row">
          <button type="button" class="cta" id="openChatBtn">Widget’ı aç</button>
        </div>
      </main>
    </div>

    <div id="f2f-ai-chatbot-root" class="f2f-ai-chatbot-root" aria-live="polite"></div>

    <script>
      window.f2fAiChatbot = null;
      fetch('/api/config')
        .then(function (r) {
          return r.json();
        })
        .then(function (cfg) {
          cfg.restUrl = '/api/';
          cfg.nonce = 'demo';
          window.f2fAiChatbot = cfg;
          var pill = document.getElementById('modePill');
          if (pill) {
            pill.textContent = cfg.hasApiKey ? 'OpenAI canlı mod' : 'Demo mod';
          }
          var s = document.createElement('script');
          s.src = '/plugin/js/widget.js';
          document.body.appendChild(s);
        })
        .catch(function () {
          var pill = document.getElementById('modePill');
          if (pill) pill.textContent = 'Bağlantı yok';
        });

      document.getElementById('openChatBtn').addEventListener('click', function () {
        var launcher = document.querySelector('.f2f-ai-launcher');
        if (launcher) launcher.click();
      });
    </script>
    <script src="/assets/demo.js"></script>
  </body>
</html>
