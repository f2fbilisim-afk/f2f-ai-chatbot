<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anadolu Makina — AI Asistan Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/plugin/css/widget.css" />
    <link rel="stylesheet" href="/assets/demo.css" />
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-top">
        <div class="brand">
          <span class="brand-mark">Anadolu</span>
          <span class="brand-name">Makina</span>
        </div>
        <p class="mode-pill" id="modePill">Yükleniyor…</p>
      </header>

      <main class="hero">
        <p class="eyebrow">Örnek müşteri sitesi (CNC / makina)</p>
        <h1>Anadolu Makina</h1>
        <p class="lede">
          Bu demo F2F jargonu değil — makina firması içeriğiyle konuşur. “Hosting
          isterim” dersen reddeder; CNC torna sorarsan siteden yanıtlar.
        </p>
        <div class="cta-row">
          <button type="button" class="cta" id="openChatBtn">Widget’ı aç</button>
          <button type="button" class="cta cta-ghost" id="downloadZipBtn" data-url="/download/f2f-ai-chatbot.zip">
            Plugin ZIP indir
          </button>
        </div>
        <p class="download-hint" id="downloadHint" hidden></p>
      </main>
    </div>

    <div id="f2f-ai-chatbot-root" class="f2f-ai-chatbot-root" aria-live="polite"></div>

    <script>
      fetch('/api/config')
        .then(function (r) {
          return r.json();
        })
        .then(function (cfg) {
          cfg.restUrl = '/api/';
          cfg.nonce = 'demo';
          window.f2fAiChatbot = cfg;
          var pill = document.getElementById('modePill');
          if (pill) {
            pill.textContent = cfg.hasApiKey ? 'OpenAI + site bilgisi' : 'Demo + site bilgisi';
          }
          var s = document.createElement('script');
          s.src = '/plugin/js/widget.js';
          document.body.appendChild(s);
        })
        .catch(function () {
          var pill = document.getElementById('modePill');
          if (pill) pill.textContent = 'Bağlantı yok';
        });

      document.getElementById('openChatBtn').addEventListener('click', function () {
        var launcher = document.querySelector('.f2f-ai-launcher');
        if (launcher) launcher.click();
      });

      (function setupZipDownload() {
        var btn = document.getElementById('downloadZipBtn');
        var hint = document.getElementById('downloadHint');
        if (!btn) return;
        var zipUrl = btn.getAttribute('data-url') || '/download/f2f-ai-chatbot.zip';
        var zipName = 'f2f-ai-chatbot.zip';

        function setHint(text, isError) {
          if (!hint) return;
          hint.hidden = !text;
          hint.textContent = text || '';
          hint.classList.toggle('is-error', Boolean(isError));
        }

        function triggerBlobDownload(blob) {
          var objectUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = objectUrl;
          a.download = zipName;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () {
            URL.revokeObjectURL(objectUrl);
          }, 2000);
        }

        btn.addEventListener('click', function () {
          btn.disabled = true;
          setHint('ZIP hazırlanıyor…', false);
          fetch(zipUrl, { cache: 'no-store' })
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.blob();
            })
            .then(function (blob) {
              if (!blob || blob.size < 100) throw new Error('Boş dosya');
              triggerBlobDownload(blob);
              setHint('İndirme başladı (' + Math.round(blob.size / 1024) + ' KB).', false);
            })
            .catch(function () {
              // Fallback: navigate so Content-Disposition can still save the file
              setHint('Doğrudan bağlantı açılıyor…', false);
              window.location.assign(zipUrl);
            })
            .finally(function () {
              btn.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
